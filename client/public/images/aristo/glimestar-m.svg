  <!-- Medicine box background -->
  <rect x="50" y="80" width="200" height="140" rx="8" fill="#008f4c" />
  
  <!-- Product name -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">GLIMESTAR-M</text>
  
  <!-- Composition -->
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Glimepiride 1mg +</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Metformin 500mg</text>
  
  <!-- Aristo logo -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffd700">ARISTO PHARMACEUTICALS</text>
  
  <!-- Pill illustrations -->
