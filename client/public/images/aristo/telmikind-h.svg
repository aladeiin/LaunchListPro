<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Medicine box background -->
  <rect x="50" y="80" width="200" height="140" rx="8" fill="#0072c6" />
  
  <!-- Product name -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">TELMIKIND-H</text>
  
  <!-- Composition -->
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Telmisartan 40mg +</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Hydrochlorothiazide 12.5mg</text>
  
  <!-- Aristo logo -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffd700">ARISTO PHARMACEUTICALS</text>
  
  <!-- Pill illustrations -->
  <circle cx="100" cy="220" r="10" fill="white" />
  <circle cx="130" cy="220" r="10" fill="white" />
  <circle cx="160" cy="220" r="10" fill="white" />
</svg>