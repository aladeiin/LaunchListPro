<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Medicine box background -->
  <rect x="50" y="80" width="200" height="140" rx="8" fill="#e91e63" />
  
  <!-- Product name -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">ATOCOR</text>
  
  <!-- Composition -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Atorvastatin 10mg</text>
  
  <!-- Aristo logo -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffd700">ARISTO PHARMACEUTICALS</text>
  
  <!-- Tablet illustrations -->
  <rect x="90" y="210" width="35" height="20" rx="3" fill="white" />
  <rect x="135" y="210" width="35" height="20" rx="3" fill="white" />
  
  <!-- Detail lines on tablets -->
  <line x1="107" y1="210" x2="107" y2="230" stroke="#f8bbd0" stroke-width="1" />
  <line x1="152" y1="210" x2="152" y2="230" stroke="#f8bbd0" stroke-width="1" />
</svg>