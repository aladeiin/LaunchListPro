<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Medicine box background -->
  <rect x="50" y="80" width="200" height="140" rx="8" fill="#00bcd4" />
  
  <!-- Product name -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">PANTOCID</text>
  
  <!-- Composition -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Pantoprazole 40mg</text>
  
  <!-- Aristo logo -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffd700">ARISTO PHARMACEUTICALS</text>
  
  <!-- Tablet illustrations -->
  <ellipse cx="100" cy="220" rx="15" ry="8" fill="white" />
  <ellipse cx="135" cy="220" rx="15" ry="8" fill="white" />
  <ellipse cx="170" cy="220" rx="15" ry="8" fill="white" />
  
  <!-- Detail lines on tablets -->
  <line x1="100" y1="215" x2="100" y2="225" stroke="#e0e0e0" stroke-width="1" />
  <line x1="135" y1="215" x2="135" y2="225" stroke="#e0e0e0" stroke-width="1" />
  <line x1="170" y1="215" x2="170" y2="225" stroke="#e0e0e0" stroke-width="1" />
</svg>