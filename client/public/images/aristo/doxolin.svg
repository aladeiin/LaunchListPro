<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Medicine box background -->
  <rect x="50" y="80" width="200" height="140" rx="8" fill="#607d8b" />
  
  <!-- Product name -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">DOXOLIN</text>
  
  <!-- Composition -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Doxofylline 400mg</text>
  
  <!-- Aristo logo -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffd700">ARISTO PHARMACEUTICALS</text>
  
  <!-- Tablet illustrations -->
  <rect x="90" y="210" width="40" height="20" rx="4" fill="white" />
  <rect x="140" y="210" width="40" height="20" rx="4" fill="white" />
  
  <!-- Detail line on tablets -->
  <line x1="110" y1="210" x2="110" y2="230" stroke="#ddd" stroke-width="1" />
  <line x1="160" y1="210" x2="160" y2="230" stroke="#ddd" stroke-width="1" />
</svg>