<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Medicine box background -->
  <rect x="50" y="80" width="200" height="140" rx="8" fill="#ff9800" />
  
  <!-- Product name -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">CALCIROL</text>
  
  <!-- Composition -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Vitamin D3 60,000 IU</text>
  
  <!-- Aristo logo -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffd700">ARISTO PHARMACEUTICALS</text>
  
  <!-- Capsule illustrations -->
  <g transform="translate(90, 220)">
    <rect x="0" y="-8" width="30" height="16" rx="8" fill="#ffeb3b" />
    <rect x="15" y="-8" width="30" height="16" rx="8" fill="#fff59d" />
  </g>
  
  <g transform="translate(150, 220)">
    <rect x="0" y="-8" width="30" height="16" rx="8" fill="#ffeb3b" />
    <rect x="15" y="-8" width="30" height="16" rx="8" fill="#fff59d" />
  </g>
</svg>